services:
  backend:
    build: ./backend
    restart: unless-stopped
    network_mode: host
    environment:
      - DATABASE_URL=sqlite:///./data/gantry.db
      - NEBULUS_CHROMA_URL=http://127.0.0.1:8001
      - NEBULUS_LLM_URL=${NEBULUS_LLM_URL:-http://127.0.0.1:18789}
      - NEBULUS_LLM_API_KEY=${NEBULUS_LLM_API_KEY:-}
      - NEBULUS_DEFAULT_MODEL=${NEBULUS_DEFAULT_MODEL:-gemma4:26b}
      - GANTRY_MIN_SOURCE_SIMILARITY=${GANTRY_MIN_SOURCE_SIMILARITY:-0.42}
      - GANTRY_KEYWORD_BOOST=${GANTRY_KEYWORD_BOOST:-on}
      - GANTRY_KEYWORD_BOOST_MAX=${GANTRY_KEYWORD_BOOST_MAX:-0.05}
      - GANTRY_KEYWORD_BOOST_WINDOW=${GANTRY_KEYWORD_BOOST_WINDOW:-0.06}
      - GANTRY_KEYWORD_BOOST_MIN_SCORE=${GANTRY_KEYWORD_BOOST_MIN_SCORE:-0.5}
      - GANTRY_REASONING_PREFILLED=${GANTRY_REASONING_PREFILLED:-false}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000,http://localhost:3001}
      # Reserved signing key (sessions are DB tokens). No key in this file.
      # Unset/blank: the backend generates a random per-install key in
      # ./data/.secret_key (0600, persisted by the volume). Set SECRET_KEY in the environment
      # or .env to supply your own (e.g. shared across replicas).
      - SECRET_KEY=${SECRET_KEY:-}
      - PYTHONPATH=/app:/atom:/core
    volumes:
      - ./data:/app/data
      - ./backend:/app/backend
      - /var/run/docker.sock:/var/run/docker.sock
      - ../nebulus-core/src:/core:ro
      - ../nebulus-atom:/atom:ro
      - ${HOME}/.atom:/root/.atom:ro
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "3002:3000"
    environment:
      - VITE_API_URL=
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0 --port 3000

networks:
  nebulus:
    external: true
    name: ${NEBULUS_NETWORK:-nebulus-prime_ai-network}
